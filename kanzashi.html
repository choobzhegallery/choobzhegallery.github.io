<title>کانزاشی های چوبژه</title>
<style>

body{
font-family:tahoma;
background:#f7f3ec;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#4a3222;
}

.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
max-width:900px;
margin:auto;
direction:ltr;
}

.product{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 3px 10px rgba(0,0,0,.1);
padding:0;
display:flex;
flex-direction:column;
}

.product img{
width:100%;
height:auto;
display:block;
}

.btn{
display:block;
text-align:center;
background:#25D366;
color:white;
padding:12px;
border-radius:10px;
text-decoration:none;
margin-top:10px;
}

.back{
display:block;
width:200px;
margin:30px auto;
text-align:center;
text-decoration:none;
background:#4a3222;
color:white;
padding:12px;
border-radius:10px;
}
  
.info-box{
background:#f4eee5;
border:1px solid #d6c4ae;
border-radius:10px;
padding:15px;
margin-top:15px;
}

.info-box p{
margin:0;
padding:10px 0;
border-bottom:1px solid #d6c4ae;
}

.info-box p:last-child{
border-bottom:none;
}
.product h3{
text-align:center;
direction:rtl;
color:#4a3222;
margin-top:10px;
}

.product a{
text-decoration:none;
color:#4a3222;
}  
</style>
</head>
<body>

">
<p style="
margin:0;
font-size:13px;
color:#666;
">
