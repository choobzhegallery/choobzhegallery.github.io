<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گردنبندهای چوبی | چوبژه</title>
<style>

body{
font-family:tahoma;
background:#f7f3ec;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#4a3222;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
max-width:1200px;
margin:auto;
}

.product{
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.product img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
border-radius:10px;
}

.btn{
display:block;
text-align:center;
background:#25D366;
color:white;
padding:12px;
border-radius:10px;
text-decoration:none;
margin-top:10px;
}

.back{
display:block;
width:200px;
margin:30px auto;
text-align:center;
text-decoration:none;
background:#4a3222;
color:white;
padding:12px;
border-radius:10px;
}
  
.info-box{
background:#f4eee5;
border:1px solid #d6c4ae;
border-radius:10px;
padding:15px;
margin-top:15px;
}

.info-box p{
margin:0;
padding:10px 0;
border-bottom:1px solid #d6c4ae;
}

.info-box p:last-child{
border-bottom:none;
}
<div class="gallery">
<div class="product">
<a href="joghd.html">
<img src="images/n1-1.jpg" alt="گردنبند جغد">
<h3>گردنبند جغد</h3>
</a>

</style>
</head>
<body>
<h1>گردنبندهای چوبی چوبژه</h1>
</div>
</div>

<a class="back" href="index.html">
بازگشت به صفحه اصلی
</a>
</body>
</html>
